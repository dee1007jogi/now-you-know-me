<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="/styles.css?v=4" />
    <link rel="stylesheet" href="/mobile.css?v=3">
    <title>Now You Know Me – Join</title>
    <style>
        .loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, #f8fafc 0%, #e2e8f0 80%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            overflow: hidden;
        }

        .mystery-loader {
            text-align: center;
        }

        .orb {
            width: 180px;
            height: 180px;
            margin: 0 auto 2rem;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #a5b4fc, #6366f1, #312e81);
            box-shadow: 
                0 0 80px #6366f1,
                0 0 160px rgba(99, 102, 241, 0.6),
                inset 0 0 60px rgba(255,255,255,0.4);
            position: relative;
            animation: orbPulse 3s infinite ease-in-out;
        }

        .inner-glow {
            position: absolute;
            inset: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.9), transparent);
            animation: innerRotate 8s linear infinite;
        }

        .scan-line {
            position: absolute;
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, transparent, #a5f3fc, transparent);
            top: 50%;
            animation: scan 2.5s linear infinite;
        }

        .loading-text {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 6px;
            color: #0f172a;
            text-transform: uppercase;
        }

        .status {
            margin-top: 2rem;
            color: #64748b;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        @keyframes orbPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @keyframes innerRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes scan {
            0% { transform: translateY(-80px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(80px); opacity: 0; }
        }

        /* Scoped Join Screen Animations */
        .join-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-badge {
            display: inline-block;
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.8), inset 0 -4px 10px rgba(255, 255, 255, 0.8);
            border: 4px solid var(--accent-blue);
            margin-bottom: 16px;
            animation: spin-badge 10s linear infinite;
            position: relative;
        }

        .logo-badge::after {
            content: "🔍";
            font-size: 2.5rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: counter-spin 10s linear infinite;
        }

        @keyframes spin-badge {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes counter-spin {
            100% {
                transform: translate(-50%, -50%) rotate(-360deg);
            }
        }

        .glow-input {
            font-size: 1.25rem !important;
            text-align: left !important;
            padding: 16px 20px !important;
            border-radius: 12px !important;
            font-weight: 800 !important;
            color: #0f172a !important;
            background: rgba(255, 255, 255, 0.9) !important;
            margin-bottom: 0px;
            border: 2px solid #bae6fd !important;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.1), inset 0 0 10px rgba(14, 165, 233, 0.05) !important;
            transition: all 0.3s;
        }

        .glow-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 1) !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3), inset 0 0 15px rgba(56, 189, 248, 0.1) !important;
        }

        .glow-input::placeholder {
            color: #94a3b8;
            font-weight: 700;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #f97316, #facc15) !important;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.6), inset 0 -4px 0 rgba(255, 255, 255, 0.8) !important;
            border: 2px solid #fef08a !important;
            color: white !important;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8) !important;
            text-transform: none !important;
            border-radius: 16px !important;
        }

        .btn-gradient:active {
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.6), inset 0 4px 0 rgba(255, 255, 255, 0.8) !important;
        }

        .owl-host {
            display: inline-block;
            font-size: 4rem;
            filter: drop-shadow(0 15px 15px rgba(255, 255, 255, 0.8));
            animation: float 4s ease-in-out infinite, wave 5s ease-in-out infinite;
            margin-bottom: 10px;
        }

        @keyframes wave {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            25% {
                transform: translateY(-10px) rotate(-10deg);
            }

            75% {
                transform: translateY(-5px) rotate(10deg);
            }
        }

        /* Unified Selfie Phase Styles */
        .selfie-frame-container {
            position: relative;
            width: 320px;
            height: 520px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 45px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(255, 255, 255, 0.8), inset 0 0 40px rgba(255, 255, 255, 0.1);
        }

        .heart-mask {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 35%, rgba(255, 255, 255, 0.8) 80%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .heart-glow {
            width: 220px;
            height: 220px;
            filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.8));
            animation: heart-pulse 2s ease-in-out infinite;
        }

        @keyframes heart-pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        /* Focus Brackets */
        .focus-bracket {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 4px solid #38bdf8;
            z-index: 20;
            filter: drop-shadow(0 0 10px #38bdf8);
        }

        .bracket-tl {
            top: 120px;
            left: 40px;
            border-right: 0;
            border-bottom: 0;
        }

        .bracket-tr {
            top: 120px;
            right: 40px;
            border-left: 0;
            border-bottom: 0;
        }

        .bracket-bl {
            bottom: 120px;
            left: 40px;
            border-right: 0;
            border-top: 0;
        }

        .bracket-br {
            bottom: 120px;
            right: 40px;
            border-left: 0;
            border-top: 0;
        }

        .capture-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #f97316 0%, #ea580c 70%, #9a3412 100%);
            border: 6px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            box-shadow: 0 0 30px rgba(234, 88, 12, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.4);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Aperture effect */
        .capture-btn::after {
            content: "";
            position: absolute;
            inset: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
        }

        .capture-btn:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .capture-btn:active {
            transform: scale(0.9);
        }

        /* Mobile Adjustments */
</style>
</head>

    <!-- LIVE STAGE UI -->
    <div id="liveStage" class="hidden" style="position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none;">
        
        <!-- TOP LEFT INSTRUCTIONS -->
        <div style="position: absolute; top: 40px; left: 40px; text-align: left; pointer-events: auto;">

    <script>
        // Initialize WebGL Engine safely
        let engine;
        try {
            engine = new WebGLEngine("webgl-container");
            window.engine = engine;
        } catch (e) {
            console.warn("WebGL not supported or error:", e);
        }

        // Global promise to sync game_logic transitions with 3D loads
        window.engineReadyPromise = new Promise(resolve => {
            window.resolveEngineReady = resolve;
        });

        // Add Interactive GSAP Hovers to HTML Elements
        addGSAPUI(".btn");
        function addGSAPUI(selector) {
            if (!window.gsap) return;
            document.querySelectorAll(selector).forEach(el => {
                el.addEventListener("mouseenter", () => gsap.to(el, { scale: 1.05, duration: 0.3, ease: "elastic.out(1, 0.3)" }));
                el.addEventListener("mouseleave", () => gsap.to(el, { scale: 1, duration: 0.3, ease: "power2.out" }));
                el.addEventListener("mousedown", () => gsap.to(el, { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1 }));
            });
        }

        

        // Create and style tooltip globally
        const tooltip = document.createElement("div");
        tooltip.innerHTML = "Enter your name!";
        tooltip.style.position = "absolute";
        tooltip.style.padding = "10px 20px";
        tooltip.style.background = "rgba(255, 255, 255, 0.9)";
        tooltip.style.border = "2px solid #38bdf8";
        tooltip.style.boxShadow = "0 8px 25px rgba(56, 189, 248, 0.5)";
        tooltip.style.color = "white";
        tooltip.style.borderRadius = "12px";
        tooltip.style.fontWeight = "800";
        tooltip.style.fontSize = "1.2rem";
        tooltip.style.pointerEvents = "none";
        tooltip.style.opacity = "0";
        tooltip.style.transition = "transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease";
        tooltip.style.zIndex = "100";
        tooltip.style.transform = "translate(-50%, -120%) scale(0.9)";
        document.getElementById("joinScreen").appendChild(tooltip);

        if (engine && window.gsap) {
            const mascotsData = window.Mobile3D.getLoginMascotData();

            async function loadAllMascots() {
                engine.interactables = [];

                // ──────────────────────────────────────────────────────────────
                // Speech Bubble Helper – positions bubble above the model head
                // ──────────────────────────────────────────────────────────────
                // Speech Bubble Helper
                //   side = 'left'  → bubble to the LEFT, arrow points right ➡
                //   side = 'above' → bubble ABOVE head, arrow points down  ↓
                // ──────────────────────────────────────────────────────────────
                // Speech Bubble Helper
                //   side = 'right' → bubble to the RIGHT, arrow points left ⬅
                //   side = 'above' → bubble ABOVE head, arrow points down  ↓
                // ──────────────────────────────────────────────────────────────
                // SPEECH BUBBLE HELPER - Promoted to window for global access
                window.showDialogue = function (model, name, text, durationS, side = 'right') {
                    return new Promise(resolve => {
                        const bubble = document.getElementById("speechBubble");
                        const arrowEl = document.getElementById("sbArrow");
                        document.getElementById("sbName").textContent = name;
                        document.getElementById("sbText").textContent = text;
                        bubble.style.display = "block";

                        if (side === 'right') {
                            // Bubble sits to the RIGHT of the character, arrow points left
                            bubble.style.transform = "translate(45%, -50%)";
                            arrowEl.style.cssText = [
                                "position:absolute", "top:10%", "left:-16px", "bottom:auto", "right:auto",
                                "transform:translateY(-50%)", "width:0", "height:0",
                                "border-top:10px solid transparent", "border-bottom:10px solid transparent",
                                "border-right:16px solid #0ea5e9"
                            ].join(";") + ";";
                        } else {
                            // Bubble sits ABOVE the head, but shifted RIGHT
                            bubble.style.transform = "translate(-15%, -110%)";
                            arrowEl.style.cssText = [
                                "position:absolute", "bottom:-16px", "left:15%", "top:auto", "right:auto",
                                "transform:translateX(-50%)", "width:0", "height:0",
                                "border-left:12px solid transparent", "border-right:12px solid transparent",
                                "border-top:16px solid #0ea5e9"
                            ].join(";") + ";";
                        }

                        // Y offset in world units above the model root (feet)
                        const diagConf = window.Mobile3D ? window.Mobile3D.getDialogueConfig(side) : { headOffsetY: side === 'above' ? 5.5 : 2.5 };
                        const headOffsetY = diagConf.headOffsetY;

                        let rafId = null;
                        let done = false;

                        function trackHead() {
                            if (done) return;
                            const worldPos = new THREE.Vector3();
                            model.getWorldPosition(worldPos);
                            worldPos.y += headOffsetY;

                            const ndc = worldPos.clone().project(engine.camera);
                            let screenX = (ndc.x * 0.5 + 0.5) * window.innerWidth;
                            let screenY = (1 - (ndc.y * 0.5 + 0.5)) * window.innerHeight;

                            const bubbleW = bubble.offsetWidth || 280;
                            const bubbleH = bubble.offsetHeight || 120;

                            if (side === 'right') {
                                // bubble occupies [screenX + offset, screenX + offset + bubbleW]
                                screenX = Math.max(10, screenX);
                                screenX = Math.min(window.innerWidth - bubbleW - 20, screenX);
                                screenY = Math.max(bubbleH / 2 + 10, Math.min(window.innerHeight - bubbleH / 2 - 10, screenY));
                            } else {
                                screenX = Math.max(bubbleW / 2 + 10, Math.min(window.innerWidth - bubbleW / 2 - 10, screenX));
                                screenY = Math.max(bubbleH + 30, Math.min(window.innerHeight - 20, screenY));
                            }

                            bubble.style.left = screenX + "px";
                            bubble.style.top = screenY + "px";

                            rafId = requestAnimationFrame(trackHead);
                        }

                        trackHead();
                        gsap.to(bubble, { opacity: 1, duration: 0.35, ease: "back.out(1.7)" });

                        setTimeout(() => {
                            gsap.to(bubble, {
                                opacity: 0, duration: 0.3, ease: "power2.in",
                                onComplete: () => {
                                    done = true;
                                    cancelAnimationFrame(rafId);
                                    bubble.style.display = "none";
                                    resolve();
                                }
                            });
                        }, durationS * 1000);
                    });
                }

                // Build the 3D Floor (White/Grey Marble look)
                const floorGeo = new THREE.PlaneGeometry(200, 200);
                const floorMat = new THREE.MeshStandardMaterial({
                    color: 0xeaeaea, // White-grey marble base
                    roughness: 0.05, // Very smooth/polished
                    metalness: 0.15, // Slight reflection
                    envMapIntensity: 1.0 // High reflection of environment
                });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2;
                floor.position.set(5, -2.5, 95);
                floor.receiveShadow = true;
                engine.scene.add(floor);

                // Add Ultra-Lush Potted Plant on the right side
                if (window.createUltraLushPlant) {
                    window.createUltraLushPlant(engine.scene, -35, -2.5, 15);
                }

                // Add Fancy Desk in front of the characters
                if (window.createFancyDesk) {
                    window.createFancyDesk(engine.scene, 2, -2.5, 60);
                }

                // Add Chandelier next to the woman
                if (window.createChandelier) {
                    window.createChandelier(engine.scene, -12, 20, 50);
                }

                // Floor Tile Grout Lines
                const gridHelper = new THREE.GridHelper(200, 150, 0x444444, 0x444444);
                gridHelper.position.y = 0.05;
                gridHelper.material.opacity = 0.08;
                gridHelper.material.transparent = true;
                gridHelper.material.depthWrite = false;
                engine.scene.add(gridHelper);

                // Build Glass Wall 
                const windowGroup = new THREE.Group();
                windowGroup.position.set(5, 5, -5);

                const glassGeo = new THREE.PlaneGeometry(200, 25);
                const glassMat = new THREE.MeshPhysicalMaterial({
                    color: 0xe0f4ff, transparent: true, opacity: 0.15,
                    roughness: 0.05, transmission: 0.9, thickness: 0.5,
                });
                const glassPane = new THREE.Mesh(glassGeo, glassMat);
                windowGroup.add(glassPane);

                const frameMat = new THREE.MeshStandardMaterial({ color: 0xd4d7dd, roughness: 0.7, metalness: 0.4 });
                const hBeamGeo = new THREE.BoxGeometry(200, 0.4, 0.4);
                [-5, 0, 5, 10].forEach(yPos => {
                    const hBeam = new THREE.Mesh(hBeamGeo, frameMat);
                    hBeam.position.set(0, yPos, 0.1);
                    windowGroup.add(hBeam);
                });
                const vBeamGeo = new THREE.BoxGeometry(0.4, 25, 0.4);
                for (let xPos = -100; xPos <= 100; xPos += 10) {
                    const vBeam = new THREE.Mesh(vBeamGeo, frameMat);
                    vBeam.position.set(xPos, 0, 0.1);
                    windowGroup.add(vBeam);
                }
                engine.scene.add(windowGroup);

                // Build Ceiling
                const ceilGeo = new THREE.PlaneGeometry(200, 200);
                const ceilMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.98 });
                const ceiling = new THREE.Mesh(ceilGeo, ceilMat);
                ceiling.rotation.x = Math.PI / 2;
                ceiling.position.set(5, 17.5, 95);
                engine.scene.add(ceiling);

                // Ceiling Bulkhead
                const bulkheadGeo = new THREE.BoxGeometry(40, 1.5, 40);
                const bulkheadMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0 });
                const bulkhead = new THREE.Mesh(bulkheadGeo, bulkheadMat);
                bulkhead.position.set(0, 16.5, 20);
                engine.scene.add(bulkhead);

                // Add Side Walls and Accent Wall
                const sideWallGeo = new THREE.PlaneGeometry(200, 25);
                const sideWallMat = new THREE.MeshStandardMaterial({ color: 0xf0f2f5, roughness: 0.95 });
                
                const leftWall = new THREE.Mesh(sideWallGeo, sideWallMat);
                leftWall.rotation.y = Math.PI / 2;
                leftWall.position.set(-60, 5, 95); // Large open plan bounds
                engine.scene.add(leftWall);

                const rightWall = new THREE.Mesh(sideWallGeo, sideWallMat);
                rightWall.rotation.y = -Math.PI / 2;
                rightWall.position.set(60, 5, 95);
                engine.scene.add(rightWall);

                // Accent wood paneling on part of left wall
                const accentWallGeo = new THREE.PlaneGeometry(30, 25);
                const accentWallMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.6 });
                const accentWall = new THREE.Mesh(accentWallGeo, accentWallMat);
                accentWall.rotation.y = Math.PI / 2;
                accentWall.position.set(-59.8, 5, 10);
                engine.scene.add(accentWall);

                // Architectural Pillars
                const pillarGeo = new THREE.BoxGeometry(2, 25, 2);
                const pillarMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.4 });
                [-45, -32, 32, 45].forEach(x => {
                    const pill = new THREE.Mesh(pillarGeo, pillarMat);
                    pill.position.set(x, 7.5, -2);
                    engine.scene.add(pill);
                });

                // Hanging Light Bars
                const lightBarGeo = new THREE.BoxGeometry(10, 0.2, 0.2);
                const lightBarMat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0xffffff, emissiveIntensity: 1.5 });
                for (let x = -60; x <= 70; x += 25) {
                    for (let z = 10; z <= 60; z += 20) {
                        const bar = new THREE.Mesh(lightBarGeo, lightBarMat);
                        bar.position.set(x, 17.3, z);
                        engine.scene.add(bar);
                    }
                }

                // Add Interior Furniture (Desks & Monitors)
                function createDesk(x, z) {
                    window.createDesk = createDesk;
                    const group = new THREE.Group();
                    group.position.set(x, -2.5, z); // Aligned to floor

                    // Desk top (Clean Modern White)
                    const deskGeo = new THREE.BoxGeometry(4.8, 0.12, 2.1);
                    const deskMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.22, metalness: 0.05 });
                    const top = new THREE.Mesh(deskGeo, deskMat);
                    top.position.y = 5.0; // Sits on 5-unit legs
                    top.castShadow = true;
                    top.receiveShadow = true;
                    group.add(top);

                    // Legs (Thin Chrome Metal)
                    const legGeo = new THREE.CylinderGeometry(0.045, 0.045, 5); // Kept length at 5 for our scene height
                    const legMat = new THREE.MeshStandardMaterial({ color: 0xc8c8c8, metalness: 0.92, roughness: 0.18 });
                    const legPos = [[-2.1, -1.3], [2.1, -1.3], [-2.1, 1.3], [2.1, 1.3]];
                    legPos.forEach(p => {
                        const leg = new THREE.Mesh(legGeo, legMat);
                        leg.position.set(p[0], 2.5, p[1]);
                        leg.castShadow = true;
                        leg.receiveShadow = true;
                        group.add(leg);
                    });

                    // Laptop
                    const laptopGeo = new THREE.BoxGeometry(0.8, 0.04, 0.55);
                    const laptopMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
                    const laptop = new THREE.Mesh(laptopGeo, laptopMat);
                    laptop.position.set(0, 5.08, -0.2); // Sitting on desk top
                    laptop.castShadow = true;
                    laptop.receiveShadow = true;
                    group.add(laptop);

                    // Small Potted Plant
                    const plantPot = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.18, 0.2, 0.25, 32),
                        new THREE.MeshStandardMaterial({ color: 0x555555 })
                    );
                    plantPot.position.set(-1.8, 5.18, -0.5);
                    plantPot.castShadow = true;
                    plantPot.receiveShadow = true;
                    group.add(plantPot);

                    // Chair
                    const chairGeo = new THREE.BoxGeometry(2, 0.4, 2);
                    const chairMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.35, metalness: 0.1 });
                    const seat = new THREE.Mesh(chairGeo, chairMat);
                    seat.position.set(0, 2.5, 2.5); // Placed slightly behind the desk
                    seat.castShadow = true;
                    seat.receiveShadow = true;
                    group.add(seat);

                    const backGeo = new THREE.BoxGeometry(2, 2.5, 0.4);
                    const back = new THREE.Mesh(backGeo, chairMat);
                    back.position.set(0, 4.0, 3.3);
                    back.castShadow = true;
                    back.receiveShadow = true;
                    group.add(back);

                    const chairLegGeo = new THREE.CylinderGeometry(0.1, 0.1, 2.5);
                    const chairLeg = new THREE.Mesh(chairLegGeo, legMat); // Reuse desk leg material
                    chairLeg.position.set(0, 1.25, 2.5);
                    chairLeg.castShadow = true;
                    chairLeg.receiveShadow = true;
                    group.add(chairLeg);

                    engine.scene.add(group);
                }

                // Scatter some desks in the background rows
                for (let x = -50; x <= 60; x += 15) {
                    // Leave a clearing for the question board and mascots (centered around x=0)
                    if (Math.abs(x - 0) < 15) continue;

                    createDesk(x, 0);
                    // Add second row further back
                    if (Math.abs(x - 5) > 10) createDesk(x, -3);
                }

                // Add desk next to Sherlock
                const foxData = mascotsData.find(m => m.name === 'fox');
                if (foxData) {
                    createDesk(foxData.pos.x + 8, foxData.pos.z - 2);
                }

                // Fade out game rules IMMEDIATELY
                const rulesOverlay = document.getElementById("gameRulesOverlay");
                if (rulesOverlay) {
                    gsap.to(rulesOverlay, { opacity: 0, scale: 0.9, duration: 0.8, ease: "power2.inOut", onComplete: () => rulesOverlay.style.display = "none" });
                }

                // Show Button Immediately
                const btn = document.getElementById("joinBtn");
                btn.style.pointerEvents = "auto";
                btn.style.opacity = "1";
                btn.style.transform = "translateY(0)";
                gsap.to(btn, { scale: 1.05, duration: 0.8, yoyo: true, repeat: -1 });

                // Allow transitions to proceed
                if (window.resolveEngineReady) window.resolveEngineReady();

                // Load models in background
                const loadModel = (data) => new Promise(resolve => {
                    engine.loadGLTF(data.path, (model) => resolve({ model, data }));
                });
                
                Promise.all(mascotsData.map(loadModel)).then((loadedAssets) => {
                    const mascots = {};
                    window._mascots = mascots; // Save globally for phase transitions
                    loadedAssets.forEach(({ model, data }) => {
                        mascots[data.name] = { model, data };
                        model.scale.set(data.scale, data.scale, data.scale);
                        model.rotation.y = data.rot || 0;
                        model.traverse((child) => {
                            if (child.isMesh) {
                                child.receiveShadow = window.innerWidth > 768; // Optimize shadows on mobile
                                child.castShadow = true;
                                if (child.material) {
                                    child.material.roughness = 0.6;
                                    child.material.metalness = 0.1;
                                    if (child.material.emissive) child.material.emissive.setHex(0x000000);
                                }
                            }
                        });
                        model.position.set(0, -100, 0); // Hide initially
                        engine.scene.add(model);
                    });

                    const owl = mascots['owl'];
                    const bunny = mascots['bunny'];
                    const fox = mascots['fox'];

                    // --- IMMEDIATE STATE (Skipping Intro Conversation) ---
                    if (window.hasInitedGame && window.initPlayerGame) {
                        window.hasInitedGame = false;
                        window.initPlayerGame();
                    } else {
                        if (owl && owl.model) owl.model.position.set(owl.data.pos.x, owl.data.pos.y, owl.data.pos.z);
                        if (bunny && bunny.model) bunny.model.position.set(bunny.data.pos.x, bunny.data.pos.y, bunny.data.pos.z);
                        if (fox && fox.model) fox.model.position.set(fox.data.pos.x, fox.data.pos.y, fox.data.pos.z);
                    }

                    // Attach general interactions back
                    let tooltipRaf = null;
                    loadedAssets.forEach(({ model, data }) => {
                        model.traverse((child) => {
                            if (child.isMesh) {
                                child.userData.onHoverEnter = () => {
                                    tooltip.innerHTML = data.tooltipText;
                                    tooltip.style.opacity = "1";
                                    tooltip.style.transform = "translate(-50%, -120%) scale(1)";

                                    const trackHead = () => {
                                        const headPos = new THREE.Vector3();
                                        model.getWorldPosition(headPos);
                                        const ttConf = window.Mobile3D ? window.Mobile3D.getTooltipConfig() : { headOffsetY: 4.5 };
                                        headPos.y += ttConf.headOffsetY;
                                        const ndc = headPos.project(engine.camera);
                                        const x = (ndc.x * 0.5 + 0.5) * window.innerWidth;
                                        const y = (1 - (ndc.y * 0.5 + 0.5)) * window.innerHeight;
                                        tooltip.style.left = x + "px";
                                        tooltip.style.top = y + "px";
                                        tooltipRaf = requestAnimationFrame(trackHead);
                                    };
                                    trackHead();
                                };
                                child.userData.onHoverLeave = () => {
                                    cancelAnimationFrame(tooltipRaf);
                                    tooltip.style.opacity = "0";
                                    tooltip.style.transform = "translate(-50%, -150%) scale(0.9)";
                                };
                                engine.addInteractable(child, () => {
                                    gsap.to(model.position, { y: data.pos.y + 1, duration: 0.3, yoyo: true, repeat: 1 });
                                    if (window.lipSyncManager && !window.lipSyncManager.isActive) {
                                        window.lipSyncManager.playAndSync(model, data.audio);
                                    }
                                });
                            }
                        });
                    });
                });

                // Button Rises with Sparkles
                btn.style.pointerEvents = "auto";
                gsap.to(btn, {
                    opacity: 1,
                    y: 0,
                    duration: 1.0,
                    ease: "elastic.out(1, 0.5)"
                });
                // Pulse the button
                gsap.to(btn, { scale: 1.05, duration: 0.8, yoyo: true, repeat: -1 });
            }

            // Load all mascots
            loadAllMascots();

            createFloatingParticles();
        }

        function createFloatingParticles() {
            if (!engine) return;
            const geo = new THREE.BufferGeometry();
            const count = 100;
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 40;     // x
                positions[i + 1] = (Math.random() - 0.5) * 40;   // y
                positions[i + 2] = (Math.random() - 0.5) * 20 - 10; // z
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ size: 0.1, color: 0xffffff, transparent: true, opacity: 0.5 });
            const particles = new THREE.Points(geo, mat);
            engine.scene.add(particles);

            if (window.gsap) {
                gsap.to(particles.rotation, { y: Math.PI * 2, duration: 150, repeat: -1, ease: "none" });
            }
        }

        function createConfetti() {
            if (!engine) return;
            const colors = [0xfacc15, 0x38bdf8, 0xf97316, 0xffffff];
            for (let i = 0; i < 150; i++) {
                const geo = new THREE.BoxGeometry(0.2, 0.2, 0.05);
                const mat = new THREE.MeshStandardMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    emissive: 0x000000,
                    roughness: 0.5
                });
                const p = new THREE.Mesh(geo, mat);
                p.position.set(0, 5, 10);
                p.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
                engine.scene.add(p);

                gsap.to(p.position, {
                    x: (Math.random() - 0.5) * 20,
                    y: -5,
                    z: 5 + Math.random() * 10,
                    duration: 2 + Math.random() * 2,
                    ease: "power2.out",
                    onComplete: () => engine.scene.remove(p)
                });
                gsap.to(p.rotation, {
                    x: Math.random() * 10,
                    y: Math.random() * 10,
                    duration: 3,
                    ease: "none"
                });
            }
        }



        // REAL JOIN LOGIC UPDATED
        document.getElementById("joinBtn").onclick = async () => {
            const nameInput = document.getElementById("name");
            const name = nameInput.value.trim();
            const msg = document.getElementById("msg");
            if (!name) {
                msg.className = "msg error animate-pop";
                msg.textContent = "Please enter your name!";
                if (window.gsap) gsap.to("#name", { x: 10, duration: 0.1, yoyo: true, repeat: 5 });
                return;
            }

            const btn = document.getElementById("joinBtn");
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Joining...";
            btn.style.pointerEvents = "none";

            try {
                // Perform REAL join to get playerId
                const res = await fetch("/api/join", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name })
                });

                if (!res.ok) {
                    const text = await res.text().catch(() => "Unknown error");
                    console.error("Server Error:", res.status, text);
                    throw new Error(`Server Error (${res.status}). Please check Render logs.`);
                }

                let data;
                const clonedRes = res.clone();
                try {
                    data = await res.json();
                } catch (jsonErr) {
                    const rawText = await clonedRes.text().catch(() => "No text");
                    console.error("JSON Parse Error. Raw response:", rawText);
                    throw new Error("Server responded with invalid data. Please refresh.");
                }
                
                if (!data || !data.playerId) throw new Error("Join failed: No Player ID returned.");
                
                // Save playerId for other pages
                localStorage.setItem("playerId", data.playerId);
                localStorage.setItem("playerName", name);

                // 1. Fade out login panel
                gsap.to(".login-panel", {
                    opacity: 0, y: -20, duration: 0.5, onComplete: () => {
                        const panel = document.querySelector(".login-panel");
                        if(panel) panel.style.display = "none";
                    }
                });

                // 2. Trigger Selfie Phase
                if (window.initPlayerGame) window.initPlayerGame();

            } catch (err) {
                console.error("Fetch Error:", err);
                btn.innerHTML = originalText;
                btn.style.pointerEvents = "auto";
                msg.className = "msg error animate-pop";
                msg.textContent = err.message || "Connection lost. Please refresh.";
            }
        };

        document.getElementById("name").addEventListener("keydown", (e) => {
            if (e.key === "Enter") document.getElementById("joinBtn").click();
        });
    </script>

</body>

</html>
