<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Leaderboard – Now You Know Me</title>
    <link rel="stylesheet" href="/styles.css?v=3">
    <link rel="stylesheet" href="/mobile.css?v=3">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #38bdf8;
            --neon-cyan: #22d3ee;
            --gold-bright: #fbbf24;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #060913 0%, #010204 100%);
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            font-family: 'Outfit', 'Inter', sans-serif;
            padding: 30px;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Ambient Glowing Corner Orbs */
        body::before {
            content: "";
            position: fixed;
            top: -10%;
            left: -10%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.06) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(192, 132, 252, 0.04) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
        }

        .header-title h1 {
            font-size: 2.2rem;
            font-weight: 950;
            margin: 0;
            background: linear-gradient(135deg, #fff 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(56, 189, 248, 0.1);
        }

        .header-title p {
            margin: 5px 0 0 0;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .game-status-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 3-Column Command Center Layout */
        .workspace-grid {
            display: flex;
            gap: 25px;
            flex: 1;
            min-height: calc(100vh - 130px);
            height: auto;
            overflow: visible;
            box-sizing: border-box;
        }

        .grid-col {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            padding: 25px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Col 1: Leaderboard */
        .col-leaderboard {
            width: 35%;
        }

        /* Col 2: Live Selfie Stream */
        .col-selfies {
            flex: 1;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
            flex-shrink: 0;
        }

        .column-header h3 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--gold-bright);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .column-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }

        .column-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .column-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* Leaderboard rows custom styling for 2D list */
        .leaderboard-row {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 12px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .leaderboard-row:hover, .leaderboard-row.active {
            background: rgba(56, 189, 248, 0.08);
            border-color: rgba(56, 189, 248, 0.3);
            transform: scale(1.01) translateX(5px);
        }

        .leaderboard-player {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-rank {
            font-weight: 900;
            font-size: 1rem;
            color: var(--neon-cyan);
            width: 25px;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            object-fit: cover;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .player-name {
            font-weight: 750;
            font-size: 0.95rem;
            color: #ffffff;
        }

        .player-score {
            font-weight: 900;
            color: var(--neon-cyan);
            font-size: 1.1rem;
        }

        /* Dossier Detail View */
        .dossier-placeholder {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            gap: 15px;
        }

        .dossier-placeholder span {
            font-size: 3rem;
        }

        .dossier-profile {
            display: flex;
            gap: 20px;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .dossier-avatar {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            border: 2px solid var(--neon-blue);
            object-fit: cover;
        }

        .dossier-name {
            font-size: 1.5rem;
            font-weight: 900;
            margin: 0 0 6px 0;
            color: white;
        }

        .dossier-level {
            display: inline-block;
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dossier-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .dossier-metric-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }

        .dossier-metric-box h6 {
            margin: 0 0 5px 0;
            font-size: 0.55rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .dossier-metric-val {
            font-size: 1.15rem;
            font-weight: 900;
            font-family: 'Outfit';
        }

        .dossier-clues {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }

        .dossier-clue-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 8px 12px;
        }

        .dossier-clue-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--neon-cyan);
            display: block;
            margin-bottom: 2px;
        }

        .dossier-clue-val {
            font-size: 0.8rem;
            font-weight: 700;
            color: white;
        }

        .dossier-selfies {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }

        .dossier-selfie-card {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            background: black;
        }

        .dossier-selfie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dossier-selfie-vs {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            font-size: 0.6rem;
            padding: 3px;
            font-weight: 800;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Live Selfie Stream Column */
        #selfiesStream {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            align-content: start;
        }

        #selfiesStream > div[style*="padding: 40px"] {
            grid-column: 1 / -1;
        }

        .stream-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color 0.3s;
        }

        .stream-img-container {
            width: 100%;
            height: 180px;
            position: relative;
            background: #000;
        }

        .stream-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .stream-badges {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stream-badge {
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 800;
            border: 1px solid transparent;
        }

        .badge-correct {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .badge-wrong {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .badge-pts {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.3);
        }

        .stream-info {
            padding: 12px 15px;
        }

        .stream-players {
            font-size: 0.85rem;
            font-weight: 750;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .stream-players span {
            color: var(--neon-cyan);
            font-weight: 900;
        }

        .stream-time {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 600;
        }

        @media (max-width: 1024px) {
            .workspace-grid {
                flex-direction: column;
                height: auto;
                overflow: visible;
            }
            .grid-col {
                width: 100% !important;
                height: 450px !important;
            }
        }

        /* Mobile specific fixes (<= 600px) */
        @media (max-width: 600px) {
            body { 
                padding: 15px; 
            }
            .header-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .header-title h1 {
                font-size: 1.6rem;
                line-height: 1.2;
            }
            .header-title p {
                font-size: 0.75rem;
                word-break: break-word;
                white-space: normal;
                line-height: 1.4;
            }
            .game-status-pill {
                align-self: flex-start;
                padding: 6px 14px;
            }
            .leaderboard-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding: 16px;
                margin-bottom: 12px;
            }
            .leaderboard-player {
                align-items: flex-start;
                width: 100%;
            }
            .player-name {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
                white-space: normal;
                word-break: break-word;
            }
            .player-name span {
                margin-left: 0 !important;
            }
            .player-score {
                margin-left: 95px; /* Aligns with player name */
                font-size: 1.3rem;
            }
            .grid-col {
                height: auto !important;
                max-height: 600px;
            }
            #leaderboardSort {
                font-size: 0.9rem !important;
                padding: 8px 12px !important;
            }
        }

        .column-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }

        .column-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .column-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header-section" style="display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;">
        <div class="header-title" style="text-align: center;">
            <h1>📊 LEADERBOARD</h1>
            <p>Intelligence Leaderboard & Live Investigation Feed</p>
        </div>
        <div class="game-status-pill" style="position: absolute; top: 15px; right: 0;">
            <span>Status:</span>
            <strong id="gameStatusText" style="color: var(--gold-bright);">LOBBY ⏳</strong>
        </div>
    </div>

    <!-- 3-Column Split View -->
    <div class="workspace-grid">

        <!-- Column 1: Leaderboard Ranking -->
        <div class="grid-col col-leaderboard">
            <div class="column-header" style="flex-direction: column; align-items: stretch; gap: 10px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>📊 Ranking List</h3>
                    <span id="playerCountText" style="font-size: 0.75rem; color: rgba(255,255,255,0.4); font-weight: 800;">0 Agents</span>
                </div>
                <div style="display: flex; gap: 10px;">
                    <select id="leaderboardSort" onchange="handleSortChange()" style="background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 5px 10px; font-size: 0.8rem; font-family: 'Outfit'; flex: 1; outline: none; cursor: pointer;">
                        <option value="score_desc" style="background: #0f172a;">Highest Score</option>
                        <option value="score_asc" style="background: #0f172a;">Lowest Score</option>
                        <option value="selfies_desc" style="background: #0f172a;">Most Selfies</option>
                        <option value="selfies_asc" style="background: #0f172a;">Least Selfies</option>
                    </select>
                </div>
            </div>
            <div id="leaderboardList" class="column-scroll">
                <div style="padding: 40px; text-align: center; opacity: 0.3;">
                    Waiting for agents to join the network...
                </div>
            </div>
        </div>

        <!-- Column 2: Live Selfie Stream -->
        <div class="grid-col col-selfies">
            <div class="column-header" style="flex-direction: column; align-items: stretch; gap: 10px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>📸 Live Selfie Feed</h3>
                    <span id="selfiesCountText" style="font-size: 0.75rem; color: rgba(255,255,255,0.4); font-weight: 800;">0 Snaps</span>
                </div>
                <div style="display: flex; gap: 10px; align-items: center; justify-content: space-between;">
                    <span style="font-size: 0.8rem; color: rgba(255,255,255,0.6);">Filter by: <strong id="currentSelfieFilter" style="color: var(--neon-cyan);">All Players</strong></span>
                    <button onclick="clearSelfieFilter()" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 8px; padding: 4px 10px; font-size: 0.7rem; font-weight: 800; cursor: pointer; display: none;" id="clearFilterBtn">CLEAR FILTER</button>
                </div>
            </div>
            <div id="selfiesStream" class="column-scroll">
                <div style="padding: 40px; text-align: center; opacity: 0.3;">
                    Waiting for selfies to stream...
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let appState = null;
        let selectedPlayerId = null;
        let currentSort = "score_desc";

        function handleSortChange() {
            currentSort = document.getElementById("leaderboardSort").value;
            renderLeaderboardList();
        }

        function clearSelfieFilter() {
            selectedPlayerId = null;
            document.querySelectorAll(".leaderboard-row").forEach(r => r.classList.remove("active"));
            document.getElementById("currentSelfieFilter").innerText = "All Players";
            document.getElementById("clearFilterBtn").style.display = "none";
            renderSelfieStream();
        }

        // Dynamic rank calculation matching profile rules
        function getInteractionLevel(p, selfiesCount) {
            const score = p.score || 0;
            const speed = p.avgCorrectSec;
            const correct = p.correct || 0;
            
            if (score >= 400 || (correct >= 4 && speed !== null && speed <= 25)) {
                return {
                    text: "Elite Investigator 🎖️",
                    color: "#c084fc",
                    bg: "rgba(192, 132, 252, 0.15)",
                    border: "1px solid rgba(192, 132, 252, 0.3)"
                };
            } else if (selfiesCount >= 3 || correct >= 3) {
                return {
                    text: "Social Matchmaker 🤝",
                    color: "#22d3ee",
                    bg: "rgba(34, 211, 238, 0.15)",
                    border: "1px solid rgba(34, 211, 238, 0.3)"
                };
            } else if (speed !== null && speed <= 20) {
                return {
                    text: "Speedy Detective ⚡",
                    color: "#f59e0b",
                    bg: "rgba(245, 158, 11, 0.15)",
                    border: "1px solid rgba(245, 158, 11, 0.3)"
                };
            } else if (correct > 0) {
                return {
                    text: "Steady Observer 🔍",
                    color: "#10b981",
                    bg: "rgba(16, 185, 129, 0.15)",
                    border: "1px solid rgba(16, 185, 129, 0.3)"
                };
            } else {
                return {
                    text: "Fresh Recruit 🕵️",
                    color: "#94a3b8",
                    bg: "rgba(148, 163, 184, 0.15)",
                    border: "1px solid rgba(148, 163, 184, 0.3)"
                };
            }
        }

        // On connection
        socket.on("connect", () => {
            console.log("Connected to Real-time Leaderboard.");
        });

        // On state synchronization
        socket.on("state", (state) => {
            appState = state;

            // Status Update
            const statusLabels = { lobby: "Lobby ⏳", live: "Live 🟢", ended: "Ended 🏁" };
            const statusEl = document.getElementById("gameStatusText");
            statusEl.innerText = statusLabels[state.status] || state.status;
            statusEl.style.color = state.status === "live" ? "#10b981" : (state.status === "ended" ? "#ef4444" : "#fbbf24");

            // Players Count
            document.getElementById("playerCountText").innerText = `${state.playersCount || 0} Agents`;

            // Render Leaderboard list
            renderLeaderboardList();

            // Render live selfie stream (chronological)
            renderSelfieStream();
        });

        // 1. Render Left Column (Leaderboard)
        function renderLeaderboardList() {
            const container = document.getElementById("leaderboardList");
            container.innerHTML = "";

            if (!appState || !appState.leaderboard || appState.leaderboard.length === 0) {
                container.innerHTML = `<div style="padding:40px; text-align:center; opacity:0.3; color:white;">Waiting for agents to join...</div>`;
                return;
            }

            const getSelfieCount = (pid) => {
                if (!appState.selfies) return 0;
                return appState.selfies.filter(s => s.playerId === pid).length;
            };

            let sortedLeaderboard = [...appState.leaderboard];
            sortedLeaderboard.sort((a, b) => {
                if (currentSort === "score_desc") return (b.score || 0) - (a.score || 0);
                if (currentSort === "score_asc") return (a.score || 0) - (b.score || 0);
                if (currentSort === "selfies_desc") return getSelfieCount(b.id) - getSelfieCount(a.id);
                if (currentSort === "selfies_asc") return getSelfieCount(a.id) - getSelfieCount(b.id);
                return 0;
            });

            sortedLeaderboard.forEach((p, i) => {
                const row = document.createElement("div");
                row.className = `leaderboard-row animate-pop ${p.id === selectedPlayerId ? 'active' : ''}`;
                row.onclick = () => {
                    // Toggle active styles locally
                    if (selectedPlayerId === p.id) {
                        selectedPlayerId = null;
                        row.classList.remove("active");
                    } else {
                        document.querySelectorAll(".leaderboard-row").forEach(r => r.classList.remove("active"));
                        row.classList.add("active");
                        selectedPlayerId = p.id;
                    }

                    const filterText = selectedPlayerId ? (p.name || 'Anonymous Intelligence') : "All Players";
                    document.getElementById("currentSelfieFilter").innerText = filterText;
                    document.getElementById("clearFilterBtn").style.display = selectedPlayerId ? "block" : "none";

                    renderSelfieStream();
                };

                let lobbyStatusBadge = "";
                if (appState.status === "lobby") {
                    const status = getPlayerLobbyStatus(p);
                    lobbyStatusBadge = `
                        <span style="font-size:0.6rem; padding:2px 6px; border-radius:6px; font-weight:800; text-transform:uppercase; color:${status.color}; background:${status.bg}; border:${status.border}; margin-left:8px; display:inline-block; vertical-align:middle; letter-spacing:0.5px;">
                            ${status.text}
                        </span>
                    `;
                }

                row.innerHTML = `
                    <div class="leaderboard-player">
                        <span class="player-rank">#${i + 1}</span>
                        <img src="${p.photoUrl || '/assets/detective_sketch.png'}" class="player-avatar" / loading="lazy">
                        <div class="player-info">
                            <span class="player-name">${p.name || 'Anonymous Intelligence'} ${lobbyStatusBadge}</span>
                        </div>
                    </div>
                    <span class="player-score">${p.score || 0} <span>pts</span></span>
                `;

                container.appendChild(row);
            });
        }

        // Helper to render completion tag inside lobby
        function getPlayerLobbyStatus(p) {
            const hasAnswers = p.answers && Object.keys(p.answers).length >= 7;
            if (hasAnswers || p.lobbyQuestionIndex === 10) {
                return { text: "SUBMITTED", color: "#10b981", bg: "rgba(16, 185, 129, 0.15)", border: "1px solid rgba(16, 185, 129, 0.3)" };
            }
            if (p.lobbyQuestionIndex !== undefined && p.lobbyQuestionIndex >= 0) {
                return { text: `Q${p.lobbyQuestionIndex + 1}`, color: "#22d3ee", bg: "rgba(34, 211, 238, 0.15)", border: "1px solid rgba(34, 211, 238, 0.3)" };
            }
            const hasPhoto = p.photoUrl && p.photoUrl !== "/assets/detective_sketch.png";
            if (hasPhoto) {
                return { text: "ONBOARDING", color: "#fbbf24", bg: "rgba(251, 191, 36, 0.15)", border: "1px solid rgba(251, 191, 36, 0.3)" };
            }
            return { text: "JOINED", color: "#94a3b8", bg: "rgba(148, 163, 184, 0.15)", border: "1px solid rgba(148, 163, 184, 0.3)" };
        }


        // 3. Render Right Column (Live chronological selfie feed)
        function renderSelfieStream() {
            const container = document.getElementById("selfiesStream");
            const countEl = document.getElementById("selfiesCountText");

            if (!appState || !appState.selfies || appState.selfies.length === 0) {
                container.innerHTML = `<div style="padding:40px; text-align:center; opacity:0.3; color:white;">No selfies captured in this session yet. 📸</div>`;
                countEl.innerText = "0 Snaps";
                return;
            }

            // Show newest snaps at the top (reverse chronological order)
            let selfies = [...appState.selfies].reverse();
            if (selectedPlayerId) {
                selfies = selfies.filter(s => s.playerId === selectedPlayerId);
            }
            
            if (selfies.length === 0) {
                container.innerHTML = `<div style="padding:40px; text-align:center; opacity:0.3; color:white; grid-column: 1 / -1;">No selfies match the current filter. 📸</div>`;
                countEl.innerText = "0 Snaps";
                return;
            }

            countEl.innerText = `${selfies.length} Snaps`;
            container.innerHTML = "";

            selfies.forEach(s => {
                const card = document.createElement("div");
                card.className = "stream-card";
                
                // Color code the card borders based on correctness
                card.style.borderColor = s.isCorrect ? "rgba(16, 185, 129, 0.2)" : "rgba(239, 68, 68, 0.2)";

                const correctBadge = s.isCorrect 
                    ? `<span class="stream-badge badge-correct">Correct Match</span>`
                    : `<span class="stream-badge badge-wrong">Wrong Match</span>`;

                const pointsBadge = s.status === "approved"
                    ? `<span class="stream-badge badge-pts">✨ +${s.creativityPoints} pts</span>`
                    : `<span class="stream-badge" style="background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.5);">⏳ Reviewing</span>`;

                card.innerHTML = `
                    <div class="stream-img-container">
                        <img src="${s.photoUrl}" alt="Selfie Snapshot" / loading="lazy">
                        <div class="stream-badges">
                            ${correctBadge}
                            ${pointsBadge}
                        </div>
                    </div>
                    <div class="stream-info">
                        <div class="stream-players">
                            <span>${s.playerName}</span> guessed <strong>${s.guessedName}</strong>
                        </div>
                        <div class="stream-time">
                            Target was: <strong>${s.targetName}</strong> | Response: ${s.elapsed !== undefined ? s.elapsed : '?'}s
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }
    </script>
    <script src="/global_navbar.js"></script>

</body>
